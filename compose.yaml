services:

  traefik:
    image: traefik:v2.11.41
    container_name: ${PROJECT_NAME}
    hostname: ${PROJECT_NAME}
    restart: unless-stopped
    depends_on:
      - dockerproxy
    ports:
        - "80:80"
        - "443:443"
        - "8080:8080"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ./${ENVIRONMENT}/traefik.yaml:/etc/traefik/traefik.yaml:ro
      - ./${ENVIRONMENT}/acme:/etc/traefik/acme
      - ./${ENVIRONMENT}/conf.d/:/etc/traefik/conf.d/
    environment:
      - AWS_EC2_METADATA_DISABLED=false
        #- AWS_EC2_METADATA_SERVICE_ENDPOINT=http://169.254.169.254
        #- AWS_EC2_METADATA_SERVICE_ENDPOINT_MODE=IPv4
      - AWS_REGION=us-east-1
      - AWS_ASSUME_ROLE_ARN=arn:aws:iam::123456789123:role/tools-prod-core-traefik-dns-manager-role
      # Opcional pero muy útil si hay muchas zonas:
      - AWS_HOSTED_ZONE_ID=<ROUTE_53_ZONE_ID>
    labels:
        - "traefik.enable=true"
        - "traefik.http.routers.${PROJECT_NAME}.rule=Host(`${DOMAIN_NAME}`)"
        - "traefik.http.routers.${PROJECT_NAME}.entrypoints=${TRAEFIK_ENTRYPOINTS:-http}"
        - "traefik.http.routers.${PROJECT_NAME}.tls=${TRAEFIK_TLS:-false}"
        - "traefik.http.routers.${PROJECT_NAME}.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-}"
        - "traefik.http.routers.${PROJECT_NAME}.middlewares=${TRAEFIK_MIDDLEWARES:-}"
        - "traefik.http.services.${PROJECT_NAME}.loadbalancer.server.port=8080"
    networks:
      - app
      - internal
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          memory: 128M

  dockerproxy:
    image: tecnativa/docker-socket-proxy
    container_name: ${PROJECT_NAME}-dockerproxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      INFO: 1
      NETWORKS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 64M
        reservations:
          memory: 32M

  portainer:
    image: portainer/portainer-ce:2.39.0-alpine
    container_name: ${PROJECT_NAME}-portainer
    restart: unless-stopped
    command: -H tcp://dockerproxy:2375
    volumes:
      - portainer_data:/data
    networks:
      - internal
      - app
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          memory: 128M
    profiles:
      - tools
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${PROJECT_NAME}-portainer.rule=Host(`portainer.${DOMAIN_NAME}`)"
      - "traefik.http.routers.${PROJECT_NAME}-portainer.entrypoints=${TRAEFIK_ENTRYPOINTS:-http}"
      - "traefik.http.routers.${PROJECT_NAME}-portainer.tls=${TRAEFIK_TLS:-false}"
      - "traefik.http.routers.${PROJECT_NAME}-portainer.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-}"
      - "traefik.http.routers.${PROJECT_NAME}-portainer.middlewares=${TRAEFIK_MIDDLEWARES:-}"
      - "traefik.http.services.${PROJECT_NAME}-portainer.loadbalancer.server.port=9000"
      - "traefik.docker.network=app"

  mailhog:
    image: mailhog/mailhog:latest
    container_name: ${PROJECT_NAME}-mailhog
    restart: unless-stopped
    volumes:
      - ./.docker/mailhog/maildir:/maildir
    networks:
      - internal
      - app
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 128M
        reservations:
          memory: 64M
    profiles:
      - mail
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${PROJECT_NAME}-mailhog.rule=Host(`mail.${DOMAIN_NAME}`)"
      - "traefik.http.routers.${PROJECT_NAME}-mailhog.entrypoints=${TRAEFIK_ENTRYPOINTS:-http}"
      - "traefik.http.routers.${PROJECT_NAME}-mailhog.tls=${TRAEFIK_TLS:-false}"
      - "traefik.http.routers.${PROJECT_NAME}-mailhog.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-}"
      - "traefik.http.routers.${PROJECT_NAME}-mailhog.middlewares=${TRAEFIK_MIDDLEWARES:-}"
      - "traefik.http.services.${PROJECT_NAME}-mailhog.loadbalancer.server.port=8025"
      - "traefik.docker.network=app"
  mailpit:
    image: axllent/mailpit:v1.29
    container_name: ${PROJECT_NAME}-mailpit
    restart: unless-stopped
    environment:
      - MP_DATABASE=/data/mailpit.db
    volumes:
      - ./.docker/mailpit/maildir:/data
    networks:
      - internal
      - app
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 128M
        reservations:
          memory: 64M
    profiles:
      - mail
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${PROJECT_NAME}-mailpit.rule=Host(`mailpit.${DOMAIN_NAME}`)"
      - "traefik.http.routers.${PROJECT_NAME}-mailpit.entrypoints=${TRAEFIK_ENTRYPOINTS:-http}"
      - "traefik.http.routers.${PROJECT_NAME}-mailpit.tls=${TRAEFIK_TLS:-false}"
      - "traefik.http.routers.${PROJECT_NAME}-mailpit.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-}"
      - "traefik.http.routers.${PROJECT_NAME}-mailpit.middlewares=${TRAEFIK_MIDDLEWARES:-}"
      - "traefik.http.services.${PROJECT_NAME}-mailpit.loadbalancer.server.port=8025"
      - "traefik.docker.network=app"

  alloy:
    image: grafana/alloy:v1.13.2
    container_name: ${PROJECT_NAME}-alloy
    restart: unless-stopped
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--stability.level=experimental", "/etc/alloy/config.alloy"]
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
      ALLOY_ANALYTICS_REPORTING_ENABLED: false
    volumes:
      - ./.docker/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - internal
      - app
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          memory: 256M
    profiles:
      - monitoring
    ports:
      - "4317:4317"
      - "4318:4318"

  prometheus:
    image: prom/prometheus:v3.10.0
    container_name: ${PROJECT_NAME}-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-remote-write-receiver"
    volumes:
      - ./.docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - app
      - internal
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          memory: 512M
    profiles:
      - monitoring
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${PROJECT_NAME}-prometheus.rule=Host(`prometheus.${DOMAIN_NAME}`)"
      - "traefik.http.routers.${PROJECT_NAME}-prometheus.entrypoints=${TRAEFIK_ENTRYPOINTS:-http}"
      - "traefik.http.routers.${PROJECT_NAME}-prometheus.tls=${TRAEFIK_TLS:-false}"
      - "traefik.http.routers.${PROJECT_NAME}-prometheus.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-}"
      - "traefik.http.routers.${PROJECT_NAME}-prometheus.middlewares=${TRAEFIK_MIDDLEWARES:-}"
      - "traefik.http.services.${PROJECT_NAME}-prometheus.loadbalancer.server.port=9090"
      - "traefik.docker.network=app"

  loki:
    image: grafana/loki:3.5.11
    container_name: ${PROJECT_NAME}-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    environment:
      - LOKI_ANALYTICS_REPORTING_ENABLED=false
    volumes:
      - ./.docker/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          memory: 256M
    profiles:
      - monitoring

  tempo:
    image: grafana/tempo:2.10.1
    container_name: ${PROJECT_NAME}-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo-config.yaml"]
    volumes:
      - ./.docker/tempo/tempo-config.yaml:/etc/tempo-config.yaml:ro
      - tempo_data:/var/tempo
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          memory: 256M
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:12.3.4
    container_name: ${PROJECT_NAME}-grafana
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "${GRAFANA_ANONYMOUS_AUTH:-false}"
      GF_SECURITY_ALLOW_EMBEDDING: "${GRAFANA_ALLOW_EMBEDDING:-false}"
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_ANALYTICS_REPORTING_ENABLED: false
      GF_ANALYTICS_CHECK_FOR_UPDATES: false
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./.docker/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - internal
      - app
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          memory: 256M
    profiles:
      - monitoring
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${PROJECT_NAME}-grafana.rule=Host(`grafana.${DOMAIN_NAME}`)"
      - "traefik.http.routers.${PROJECT_NAME}-grafana.entrypoints=${TRAEFIK_ENTRYPOINTS:-http}"
      - "traefik.http.routers.${PROJECT_NAME}-grafana.tls=${TRAEFIK_TLS:-false}"
      - "traefik.http.routers.${PROJECT_NAME}-grafana.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-}"
      - "traefik.http.routers.${PROJECT_NAME}-grafana.middlewares=${TRAEFIK_MIDDLEWARES:-}"
      - "traefik.http.services.${PROJECT_NAME}-grafana.loadbalancer.server.port=3000"
      - "traefik.docker.network=app"

volumes:
  portainer_data:
    driver: local
  prometheus_data:
    driver: local
  loki_data:
    driver: local
  tempo_data:
    driver: local
  grafana_data:
    driver: local

networks:
  app:
    external: true
  internal:
    internal: true
